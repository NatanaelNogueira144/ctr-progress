<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTR Progress - Export</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="shortcut icon" href="../assets/media/favicon.ico" type="image/x-icon">
</head>
<body>
  <div id="background" initial-src="../assets/media/Menu.gif"></div>

  <main class="content">
    <div class="flex justify-content-center align-items-center w-100 h-100">
      <div class="card">
        <div class="card-body flex flex-column gap-sm">
          <h2 class="text-orange text-center">Export Category Data</h2>

          <button class="file-picker__button" id="export-category-csv-button">
            <span>Export to CSV File</span>
          </button>

          <button class="file-picker__button" id="export-category-xlsx-button">
            <span>Export to XLSX File</span>
          </button>
          
          <h2 class="text-orange text-center">Export Grind Data</h2>

          <button class="file-picker__button" id="export-grind-csv-button">
            <span>Export to CSV File</span>
          </button>
    
          <button class="file-picker__button" id="export-grind-xlsx-button">
            <span>Export to XLSX File</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/utils/array-utils.js"></script>
  <script src="../assets/js/utils/date-utils.js"></script>
  <script src="../assets/js/components/updater.js"></script>
  <script src="../assets/js/components/controls.js"></script>
  <script src="../assets/js/components/background.js"></script>
  <script src="../assets/js/packages/xlsx.js"></script>
  <script src="../assets/js/pages/export.js"></script>
</body>
</html>
