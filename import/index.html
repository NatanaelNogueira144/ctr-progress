<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTR Progress - Import</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="shortcut icon" href="../assets/images/favicon.ico" type="image/x-icon">
</head>
<body>
  <div id="background" initial-src="../assets/images/tracks/Menu.png"></div>

  <main class="content">
    <div class="flex flex-column gap-sm">
      <h1 class="text-orange text-center">Import Data</h1>
  
      <div class="card">
        <div class="card-body flex flex-column gap-sm">
          <p class="text-orange text-center">Import Category Data</p>

          <div class="flex justify-content-center">
            <label class="file-picker">
              <span class="file-picker__button">Import CSV file</span>
              <input type="file" id="import-category-csv" accept=".csv,text/csv" hidden>
            </label>
          </div>
        </div>
      </div>
  
      <div class="card">
        <div class="card-body flex flex-column gap-sm">
          <p class="text-orange text-center">Import Grind Data</p>

          <div class="flex justify-content-center">
            <label class="file-picker">
              <span class="file-picker__button">Import CSV file</span>
              <input type="file" id="import-grind-csv" accept=".csv,text/csv" hidden>
            </label>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/utils/array-utils.js"></script>
  <script src="../assets/js/utils/date-utils.js"></script>
  <script src="../assets/js/components/controls.js"></script>
  <script src="../assets/js/components/background.js"></script>
  <script src="../assets/js/pages/import.js"></script>
</body>
</html>
